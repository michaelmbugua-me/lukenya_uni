<!-- Overlay Background -->
<div *ngIf="isOpen" 
     (click)="onClose()"
     class="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm animate-fadeIn">
</div>

<!-- Side Drawer -->
<div [class.translate-x-full]="!isOpen"
     [class.translate-x-0]="isOpen"
     class="fixed top-0 right-0 z-[101] h-full w-full lg:w-[80%] bg-white shadow-2xl transition-transform duration-500 ease-in-out overflow-y-auto lg:overflow-hidden flex flex-col lg:flex-row">
  
  <!-- Left sidebar section (Drawer) -->
  <div class="bg-gradient-to-b from-lu-green to-lu-green-dark text-white w-full lg:w-1/3 p-6 lg:p-12 flex flex-col justify-between relative min-h-[400px] lg:min-h-0">
    <!-- Close button for mobile inside left panel -->
    <button (click)="onClose()" class="lg:hidden absolute top-4 right-4 text-white hover:text-lu-yellow transition-colors">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <div>
      <!-- Logo -->
      <div class="mb-12 flex items-center gap-3">
        <div class="w-12 h-12 bg-lu-yellow rounded-lg flex items-center justify-center font-bold text-lu-green-dark text-lg shadow-lg">
          LU
        </div>
        <div class="text-xs font-bold tracking-[0.2em] leading-tight">
          <div>LUKENYA</div>
          <div>UNIVERSITY</div>
        </div>
      </div>

      <!-- Main section title -->
      <div class="mb-10">
        <h1 class="text-4xl lg:text-6xl font-extrabold leading-tight mb-6">
          {{ title }}
        </h1>
        <p class="text-base lg:text-lg text-white/80 leading-relaxed font-medium">
          {{ description }}
        </p>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="space-y-4 mt-8">
      <button
        (click)="onDownloadBrochure()"
        class="w-full bg-lu-yellow hover:bg-lu-yellow-dark text-lu-green-dark font-bold py-4 px-6 rounded-lg transition-all duration-300 shadow-md hover:shadow-xl transform hover:-translate-y-1"
      >
        Download Brochure
      </button>
      <button
        (click)="onViewFees()"
        class="w-full border-2 border-lu-yellow text-lu-yellow hover:bg-lu-yellow/10 font-bold py-4 px-6 rounded-lg transition-all duration-300 shadow-sm"
      >
        Fee Structure
      </button>
    </div>
  </div>

  <!-- Right content section (Drawer) -->
  <div class="bg-lu-green text-white w-full lg:w-2/3 p-6 lg:p-16 flex flex-col justify-between relative">
    <!-- Close button for desktop -->
    <button (click)="onClose()" class="hidden lg:flex absolute top-8 right-8 text-white/50 hover:text-lu-yellow transition-all p-2 hover:bg-white/10 rounded-full">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <!-- Message header -->
    <div class="max-w-3xl">
      <div class="text-lu-yellow text-sm font-bold mb-4 uppercase tracking-[0.3em]">
        {{ subtitle }}
      </div>
      <h2 class="text-3xl lg:text-5xl font-extrabold mb-10 leading-tight">
        Message from the Dean,
        <br />
        {{ deanName }}
      </h2>

      <!-- Welcome message -->
      <div class="space-y-6 text-base lg:text-lg leading-relaxed text-white/90 font-medium overflow-y-auto max-h-[50vh] lg:max-h-none pr-4 custom-scrollbar">
        @for (para of paragraphs; track $index) {
          <p>{{ para }}</p>
        }
        <p class="font-bold text-lu-yellow">
          Warm Regards
        </p>
      </div>
    </div>

    <!-- Dean profile section -->
    <div class="mt-12 flex flex-col lg:flex-row gap-6 items-center lg:items-end">
      <!-- Dean's image -->
      <div class="w-28 h-36 lg:w-40 lg:h-52 bg-white/10 rounded-2xl overflow-hidden shadow-2xl border-2 border-white/20">
        <img [src]="deanImage" [alt]="deanName" class="w-full h-full object-cover object-top" />
      </div>
      <div class="text-center lg:text-left pb-2">
        <h3 class="text-2xl lg:text-3xl font-extrabold">{{ deanName }}</h3>
        <p class="text-lu-yellow text-sm lg:text-base mt-2 font-bold tracking-wide">{{ deanSubtitle }}</p>
      </div>
    </div>
  </div>
</div>
