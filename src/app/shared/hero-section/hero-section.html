<section class="hero-section">
  <img [src]="imageUrl" [alt]="imageAlt" class="hero-image">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    @if (eyebrow) {
      <p class="eyebrow">{{ eyebrow }}</p>
    }
    <h1>{{ title }}</h1>
    @if (description) {
      <p>{{ description }}</p>
    }
    @if (!isExternalLink) {
      <a [routerLink]="buttonLink" class="primary-button">{{ buttonText }}</a>
    } @else {
      <a [href]="buttonLink" class="primary-button">{{ buttonText }}</a>
    }

  </div>
</section>
